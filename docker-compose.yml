name: groomsman-site

services:
  app:
    image: groomsman-site:local
    build:
      context: .
      args:
        VCS_REF: ${VCS_REF:-local}
    restart: unless-stopped
    ports:
      - "${BIND_ADDRESS:-0.0.0.0}:${APP_PORT:-3000}:8080"
    read_only: true
    tmpfs:
      - /tmp:mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
