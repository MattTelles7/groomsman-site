name: Checks
on:
  push:
    branches: [main, develop, 'feature/**', 'fix/**']
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: bash -n install.sh update.sh scripts/deploy.sh
      - run: shellcheck install.sh update.sh scripts/deploy.sh
      - name: Build and exercise the deployment container
        run: |
          cp .env.example .env
          docker compose up -d --build --wait --wait-timeout 60
          curl --fail http://localhost:3000/healthz
          curl --fail http://localhost:3000/ | grep -q 'The Groom'
          test "$(docker compose exec -T app id -u)" != 0
          curl -sI http://localhost:3000/ | grep -qi 'cache-control: no-store'
          curl --fail -D /tmp/calendar-headers -o /tmp/schedule.ics http://localhost:3000/schedule.ics
          grep -qi 'content-type: text/calendar' /tmp/calendar-headers
          grep -qi 'cache-control: no-store' /tmp/calendar-headers
          grep -q 'BEGIN:VCALENDAR' /tmp/schedule.ics
          grep -q 'UID:mass@groomsman-site.matt-telles' /tmp/schedule.ics
      - if: always()
        run: docker compose logs --tail=50 && docker compose down
